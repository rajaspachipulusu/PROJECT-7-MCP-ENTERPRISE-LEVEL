model: qwen3:8b

audit_log_path: data/audit_log.db

servers:
  - name: hr
    path: hr_server.py
    enabled: true
    description: Employee lookups and department rosters
    log_path: logs/hr_server.log

  - name: ticketing
    path: ticketing_server.py
    enabled: true
    description: Support ticket creation and tracking
    log_path: logs/ticketing_server.log

  - name: knowledge
    path: knowledge_server.py
    enabled: true
    description: Company policy document search (RAG)
    embed_model: nomic-embed-text
    log_path: logs/knowledge_server.log